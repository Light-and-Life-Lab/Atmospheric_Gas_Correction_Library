[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "lll-gas-corr-lib"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "h5py",
    "pyhdf",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
cmake.source-dir = "gas_corrections_lib/gas_corrections_cpp"
wheel.packages = ["gas_corrections_lib"]
wheel.exclude = [
    "**/*.cpp",
    "**/*.hpp",
    "**/*.h",
    "**/__pycache__/**",
    "**/.pytest_cache/**",
]