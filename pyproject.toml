[build-system]
requires = ["scikit-build-core", "pybind11", "setuptools_scm"]
build-backend = "scikit_build_core.build"

[project]
name = "lll-gas-corr-lib"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "h5py",
]

[project.optional-dependencies]
test = [
	"pytest",
	"pyhdf",
	"matplotlib",
	"netCDF4",
]

[tool.scikit-build]
cmake.source-dir = "gas_corrections_lib/gas_corrections_cpp"
wheel.packages = ["gas_corrections_lib"]
wheel.exclude = [
    "**/*.cpp",
    "**/*.hpp",
    "**/*.h",
    "**/__pycache__/**",
    "**/.pytest_cache/**",
	"**/test/**",
]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.cibuildwheel]
build = "cp*"  # Wheels will be built for all CPython versions subject to the versions specified by requires-python
skip = "*-win* *-musllinux*"  # Exclude Windows and Alpine/musl Linux (leaving only macOS and manylinux)
test-extras = ["test"]
test-command = "pytest {project}/gas_corrections_lib/test"
build-verbosity = 1

[tool.cibuildwheel.linux]
before-all = "yum install -y epel-release && yum install -y hdf-devel"

[tool.cibuildwheel.macos]
before-all = """
set -e

# Install HDF4
curl -L https://github.com/HDFGroup/hdf4/releases/download/hdf4.3.1/hdf4.3.1-macos14_clang.tar.gz -o hdf4.tar.gz;
tar -xzf hdf4.tar.gz;
sudo mkdir -p /usr/local/hdf4;
sudo tar -xzf hdf4/HDF-4.3.1-Darwin.tar.gz -C /usr/local/hdf4 --strip-components=4;

#Install OpenMP
curl -L -o openmp.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/openmp-18.1.8.src.tar.xz;
curl -L -o cmake-src.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/cmake-18.1.8.src.tar.xz;
tar -xf openmp.tar.xz;
tar -xf cmake-src.tar.xz;
mv openmp-18.1.8.src openmp;
mv cmake-18.1.8.src cmake;
cd openmp;
mkdir build;
cd build;
cmake .. -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_INSTALL_PREFIX=/usr/local/libomp;
make -j4;
sudo make install;
"""
environment = { CPATH="/usr/local/hdf4/include:/usr/local/libomp/include", LIBRARY_PATH="/usr/local/hdf4/lib:/usr/local/libomp/lib" }
